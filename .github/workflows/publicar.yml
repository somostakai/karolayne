name: Publicar site

# Toda vez que uma edição entra na main, o site é reconstruído e publicado.
# Também dá para disparar na mão pela aba Actions do repositório.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O build não tem dependência nenhuma: o Python que já vem na máquina basta.
      - name: Gerar o site
        run: python3 scripts/build.py

      # enablement: true liga o GitHub Pages do repositório sozinho,
      # sem precisar configurar nada em Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
