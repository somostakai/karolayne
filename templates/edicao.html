<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ titulo }} — {{ site_nome }}</title>
<meta name="description" content="{{ descricao }}" />
<link rel="canonical" href="{{ url_canonica }}" />
<link rel="icon" href="{{ logo }}" />
<link rel="stylesheet" href="{{ prefixo }}estilo.css" />

<!-- Preview do link quando você manda no direct / WhatsApp -->
<meta property="og:type" content="article" />
<meta property="og:title" content="{{ titulo }}" />
<meta property="og:description" content="{{ descricao }}" />
<meta property="og:url" content="{{ url_canonica }}" />
<meta property="og:image" content="{{ og_image }}" />
<meta property="og:site_name" content="{{ site_nome }}" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>
<div class="progresso" id="progresso"></div>

<header class="topo">
  <img src="{{ logo }}" alt="" />
  <a href="{{ prefixo }}">{{ site_nome }}</a>
</header>

<main>
  <div class="cabecalho">
    <span class="etiqueta">{{ etiqueta }}</span>
    <h1>{{ titulo }}</h1>
    <p class="subtitulo">{{ subtitulo }}</p>
    <p class="meta">{{ data_legivel }} · {{ minutos }} min de leitura</p>
  </div>

  <article>
    {{ corpo }}
  </article>

  {{ cta }}

  {{ relacionadas }}
</main>

<footer class="rodape">
  <p class="rodape__bio"><strong>{{ autora }}</strong> — {{ autora_bio }}</p>
  {{ rodape_links }}
  <p>© {{ ano }} {{ site_nome }}</p>
</footer>

<script>
  // Barra de progresso da leitura
  var barra = document.getElementById('progresso');
  function atualizar() {
    var altura = document.documentElement.scrollHeight - window.innerHeight;
    var pct = altura > 0 ? (window.scrollY / altura) * 100 : 0;
    barra.style.width = Math.min(100, Math.max(0, pct)) + '%';
  }
  window.addEventListener('scroll', atualizar, { passive: true });
  window.addEventListener('resize', atualizar);
  atualizar();
</script>
{{ analytics }}
</body>
</html>
