<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ titulo }} · {{ site_nome }}</title>
<meta name="description" content="{{ descricao }}" />
<link rel="canonical" href="{{ url_canonica }}" />
<link rel="icon" href="{{ logo }}" />
<link rel="stylesheet" href="{{ prefixo }}estilo.css" />

<!-- Preview do link quando você manda no direct / WhatsApp -->
<meta property="og:type" content="article" />
<meta property="og:title" content="{{ titulo }}" />
<meta property="og:description" content="{{ descricao }}" />
<meta property="og:url" content="{{ url_canonica }}" />
<meta property="og:image" content="{{ og_image }}" />
<meta property="og:site_name" content="{{ site_nome }}" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>
<div class="progresso" id="progresso"></div>

<header class="topo">
  <img src="{{ logo }}" alt="" />
  <a href="{{ prefixo }}">{{ site_nome }}</a>
</header>

<main>
  <div class="cabecalho">
    <span class="etiqueta">{{ etiqueta }}</span>
    <h1>{{ titulo }}</h1>
    <p class="subtitulo">{{ subtitulo }}</p>
    <p class="meta">{{ data_legivel }} · {{ minutos }} min de leitura</p>
  </div>

  <article>
    {{ corpo }}
  </article>

  {{ cta }}

  {{ relacionadas }}
</main>

<footer class="rodape">
  <p class="rodape__bio"><strong>{{ autora }}</strong><br />{{ autora_bio }}</p>
  {{ rodape_links }}
  <p>© {{ ano }} {{ site_nome }}</p>
</footer>

<button class="ao-topo" id="ao-topo" type="button" aria-label="Voltar ao topo do artigo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5" />
    <path d="M5 12l7-7 7 7" />
  </svg>
</button>

<script>
  var barra = document.getElementById('progresso');
  var aoTopo = document.getElementById('ao-topo');

  function atualizar() {
    var altura = document.documentElement.scrollHeight - window.innerHeight;
    var pct = altura > 0 ? (window.scrollY / altura) * 100 : 0;
    barra.style.width = Math.min(100, Math.max(0, pct)) + '%';

    // Só aparece depois de uma tela cheia de rolagem: antes disso o topo
    // ainda está perto e o botão só atrapalharia a leitura.
    aoTopo.classList.toggle('visivel', window.scrollY > window.innerHeight);
  }

  aoTopo.addEventListener('click', function () {
    var suave = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: suave ? 'smooth' : 'auto' });
  });

  window.addEventListener('scroll', atualizar, { passive: true });
  window.addEventListener('resize', atualizar);
  atualizar();
</script>
{{ analytics }}
</body>
</html>
