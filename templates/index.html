<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ titulo_aba }}</title>
<meta name="description" content="{{ descricao }}" />
<link rel="canonical" href="{{ url_canonica }}" />
<link rel="icon" href="{{ logo }}" />
<link rel="stylesheet" href="{{ prefixo }}estilo.css" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ hero_titulo }}" />
<meta property="og:description" content="{{ descricao }}" />
<meta property="og:url" content="{{ url_canonica }}" />
<meta property="og:image" content="{{ og_image }}" />
<meta property="og:site_name" content="{{ site_nome }}" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body class="pagina-larga">

<header class="topo">
  <a class="topo__marca" href="{{ prefixo }}">
    <img src="{{ logo }}" alt="" />
    <span>{{ site_nome }}</span>
  </a>
  {{ menu }}
</header>

<main>
  <div class="hero">
    <div>
      <h1>{{ hero_titulo }}</h1>
      <p class="hero__tagline">{{ hero_tagline }}</p>
    </div>
    <div class="hero__painel">
      <img src="{{ logo }}" alt="" />
      <p class="hero__descricao">{{ hero_descricao }}</p>
    </div>
  </div>

  {{ conteudo }}

  {{ sobre }}
</main>

<footer class="rodape">
  {{ rodape_bio }}
  {{ rodape_links }}
  <p>© {{ ano }} {{ site_nome }}</p>
</footer>
{{ analytics }}
</body>
</html>
